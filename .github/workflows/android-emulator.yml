name: Android Emulator - Pruebas y Reporte

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Android SDK Command-line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"

      - name: Crear AVD (Pixel 7)
        run: |
          echo "no" | avdmanager create avd -n Pixel_7_CI -k "system-images;android-34;google_apis;x86_64" -d "pixel_7" --force
          echo "avd.name=Pixel_7_CI" >> $HOME/.opencode-android.env

      - name: Iniciar emulador en segundo plano
        run: |
          $HOME/android-sdk/emulator/emulator -avd Pixel_7_CI -no-snapshot -no-audio -no-boot-anim -wipe-data -gpu swiftshader_indirect -no-window > /dev/null 2>&1 &
          echo "Esperando a que el emulador esté listo..."
          for i in $(seq 1 60); do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              echo "Emulador listo."
              break
            fi
            sleep 5
          done
          adb devices

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Instalar APK de prueba
        run: |
          # Cambia esta ruta por el APK de tu proyecto
          if [ -f "app-release.apk" ]; then
            adb install -r app-release.apk
          else
            echo "No se encontró app-release.apk, saltando instalación."
          fi

      - name: Ejecutar pruebas instrumentadas y generar reporte
        run: |
          # Cambia com.example.miapp.test por el paquete de pruebas de tu proyecto
          if [ -n "$TEST_PACKAGE" ]; then
            pwsh scripts/run-and-report-tests.ps1 -TestPackage "$TEST_PACKAGE" || true
          else
            echo "TEST_PACKAGE no definido, saltando pruebas."
          fi

      - name: Publicar reporte HTML como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: test-reports/
          retention-days: 7

      - name: Apagar emulador
        if: always()
        run: adb emu kill 2>/dev/null || true
